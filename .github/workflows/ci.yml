name: Aplicar cobranzas por cliente

on:
  push:
    branches:
      - agent/aplicar-cobranzas-clientes

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar rama temporal
        uses: actions/checkout@v4
        with:
          ref: agent/aplicar-cobranzas-clientes
          fetch-depth: 0

      - name: Reconstruir y validar paquete
        run: |
          cat .github/cobranzas.part.* | base64 --decode > /tmp/cobranzas-files.tgz
          echo "3efee806c9aa0d32030f57e58b41d62dcc8145611d3b5a79c9c508ed11a30692  /tmp/cobranzas-files.tgz" | sha256sum --check -
          tar -xzf /tmp/cobranzas-files.tgz
          rm -f .github/cobranzas.part.*
          rm -f .github/workflows/aplicar-cobranzas.yml
          git fetch origin master
          git checkout origin/master -- .github/workflows/ci.yml

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Publicar implementación validada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implementar cobranzas por cliente y saldo a favor"
          git push origin HEAD:feature/cobranzas-clientes-saldo-favor
