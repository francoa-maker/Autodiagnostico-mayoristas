<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Portal Autodiagnóstico — Maqueta panel interno</title>
<style>
  :root{
    --red:#C8102E; --red-600:#a60d26; --red-050:#fff0f2; --red-100:#fbdbe0;
    --dark:#111111; --dark-2:#1c1c1c; --mid:#2C2C2C; --light:#F4F4F4;
    --card:#ffffff; --surface-2:#f7f7f8; --surface-3:#eeeef0;
    --border:#E4E4E7; --border-strong:#d2d2d6; --muted:#8a8a90; --faint:#aeaeb4; --ink:#161616;
    --ok-bg:#dcfce7; --ok-fg:#166534; --low-bg:#fef9c3; --low-fg:#854d0e; --out-bg:#fee2e2; --out-fg:#991b1b;
    --green:#16a34a; --blue:#2563eb;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 3px 12px rgba(0,0,0,.05);
    --shadow-lg:0 12px 38px rgba(0,0,0,.16);
    --radius:12px; --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box} html,body{margin:0;background:var(--light)}
  body{font-family:var(--sans);color:var(--mid);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button{font-family:inherit} .num{font-variant-numeric:tabular-nums} .mono{font-family:var(--mono)}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  .mockflag{background:#111;color:#ccc;text-align:center;font-size:11.5px;padding:5px} .mockflag b{color:var(--red)}

  .layout{display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh}
  /* Sidebar */
  .side{background:var(--card); border-right:1px solid var(--border); display:flex; flex-direction:column; position:sticky; top:0; height:100vh}
  .side .brand{display:flex; align-items:center; gap:10px; padding:16px 16px; border-bottom:1px solid var(--border)}
  .side .brand .mark{width:32px;height:32px;border-radius:7px;background:var(--red);display:grid;place-items:center;color:#fff;flex:none}
  .side .brand .mark svg{width:19px;height:19px}
  .side .brand .word{font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--dark)}
  .side .brand .word span{color:var(--red)}
  .side nav{padding:10px 8px; overflow:auto; flex:1}
  .navitem{display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:transparent; border:0; cursor:pointer; color:var(--mid); font-size:13.5px; font-weight:500; padding:9px 11px; border-radius:8px; position:relative}
  .navitem:hover{background:var(--surface-2)}
  .navitem.active{background:var(--red-050); color:var(--red-600); font-weight:600}
  .navitem.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--red);border-radius:3px}
  .navitem svg{width:18px;height:18px;flex:none}
  .navitem .nb{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:999px;display:grid;place-items:center}
  .navitem.hidden{display:none}
  .side .foot{border-top:1px solid var(--border); padding:12px}
  .side .foot .u{display:flex;align-items:center;gap:9px;margin-bottom:10px}
  .side .foot .ua{width:32px;height:32px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
  .side .foot .un{font-size:12.5px;font-weight:700;color:var(--dark);line-height:1.1}
  .side .foot .ue{font-size:11px;color:var(--muted)}
  .side .foot label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:4px}
  .side .foot select{width:100%;height:36px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);font-size:13px;padding:0 9px;outline:none;color:var(--ink)}
  .side .foot select:focus{border-color:var(--red)}
  .side .foot .hint{font-size:10.5px;color:var(--faint);margin-top:6px}

  .main{min-width:0; display:flex; flex-direction:column}
  .topbar{background:var(--card); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; padding:13px 22px}
  .topbar h1{margin:0; font-size:19px; font-weight:800; letter-spacing:-.02em; color:var(--dark)}
  .topbar .rolechip{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--dark);color:#fff;padding:3px 10px;border-radius:999px}
  .topbar .spacer{flex:1}
  .content{padding:22px; max-width:1240px; width:100%}
  .section{display:none} .section.active{display:block; animation:fade .16s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .btn{cursor:pointer;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:13px;padding:0 14px;height:38px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
  .btn svg{width:15px;height:15px}
  .btn-red{background:var(--red);color:#fff} .btn-red:hover{background:var(--red-600)}
  .btn-dark{background:var(--dark);color:#fff} .btn-dark:hover{background:var(--dark-2)}
  .btn-ghost{background:var(--surface-2);color:var(--mid);border-color:var(--border)} .btn-ghost:hover{border-color:var(--border-strong);color:var(--ink)}
  .btn-sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:7px}
  .btn-xs{height:28px;padding:0 9px;font-size:11.5px;border-radius:6px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
  .kpi .k{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  .kpi .v{font-size:24px;font-weight:800;margin-top:3px;color:var(--dark)}
  .kpi .d{font-size:11.5px;color:var(--muted);margin-top:2px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
  .panel .ph{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--border)}
  .panel .ph h3{margin:0;font-size:14px;font-weight:800;color:var(--dark)}
  .panel .ph .spacer{flex:1}
  .panel .pb{padding:6px}
  .panel .pad{padding:15px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  .tscroll{overflow-x:auto} table.min{min-width:720px}
  thead th{background:var(--dark);color:#fff;text-align:left;font-weight:600;font-size:11px;letter-spacing:.03em;text-transform:uppercase;padding:10px 13px;white-space:nowrap}
  thead th.r,td.r{text-align:right} thead th.c,td.c{text-align:center}
  tbody td{padding:9px 13px;border-bottom:1px solid var(--border);color:var(--mid)}
  tbody tr:last-child td{border-bottom:0} tbody tr:hover{background:var(--surface-2)} tbody td b{color:var(--dark)}
  tfoot td{padding:11px 13px;font-weight:800;color:var(--dark);background:var(--surface-3);border-top:2px solid var(--border-strong)}
  .simple thead th{background:var(--surface-3);color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .pill .dot{width:7px;height:7px;border-radius:50%}
  .pill.ok{background:var(--ok-bg);color:var(--ok-fg)} .pill.ok .dot{background:var(--ok-fg)}
  .pill.warn{background:var(--low-bg);color:var(--low-fg)} .pill.warn .dot{background:var(--low-fg)}
  .pill.info{background:var(--red-050);color:var(--red-600)} .pill.info .dot{background:var(--red)}
  .pill.neutral{background:var(--surface-3);color:var(--muted)} .pill.neutral .dot{background:var(--muted)}
  .pill.blue{background:#e6efff;color:var(--blue)} .pill.blue .dot{background:var(--blue)}
  .icononly{border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--muted);width:30px;height:30px;border-radius:7px;display:inline-grid;place-items:center}
  .icononly:hover{color:var(--red);border-color:var(--red-100);background:var(--red-050)} .icononly svg{width:15px;height:15px}
  .icononly.g:hover{color:var(--green);border-color:#bbf7d0;background:var(--ok-bg)}
  .rowact{display:flex;gap:4px;justify-content:flex-end}
  .inp{height:32px;border:1px solid var(--border);border-radius:7px;background:var(--surface-2);padding:0 8px;font-size:13px;outline:none;color:var(--ink);width:100%}
  .inp:focus{border-color:var(--red)} .inp.mini{width:64px;text-align:right} .inp.ord{width:52px;text-align:center}
  select.inp{padding:0 6px}
  .toolbar{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar .spacer{flex:1}
  .searchbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0 11px;height:38px;min-width:220px}
  .searchbox svg{width:16px;height:16px;color:var(--faint)} .searchbox input{border:0;background:transparent;outline:none;font-size:13.5px;width:100%}
  .eye{border:1px solid var(--border);background:var(--card);width:30px;height:30px;border-radius:7px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center}
  .eye.on{color:var(--green);border-color:#bbf7d0;background:var(--ok-bg)} .eye.off{color:var(--faint)}
  .eye svg{width:15px;height:15px}
  .muted{color:var(--muted)} .small{font-size:12px}

  /* catalog editor cards */
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .ccard{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;position:relative}
  .ccard.hidden-prod{opacity:.55}
  .ccard .cth{height:84px;background:var(--surface-2);display:grid;place-items:center;border-bottom:1px solid var(--border);position:relative}
  .ccard .cth svg{width:34px;height:34px;color:#9aa0a6}
  .ccard .drag{position:absolute;top:6px;left:6px;color:var(--faint);cursor:grab;font-size:13px}
  .ccard .chk{position:absolute;top:6px;right:6px}
  .ccard .cb{padding:9px 10px}
  .ccard .cn{font-size:12px;font-weight:700;color:var(--dark);line-height:1.3;min-height:31px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ccard .cm{font-size:10.5px;color:var(--muted);font-family:var(--mono);margin-top:2px}
  .ccard .cp{font-size:12px;font-weight:700;color:var(--dark);margin-top:5px}
  .ccard .ca{display:flex;gap:4px;margin-top:8px}

  /* modal */
  .modal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;background:rgba(0,0,0,.45)} .modal.open{display:flex}
  .modal-box{background:var(--card);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:600px;overflow:hidden}
  .modal-box.wide{max-width:860px}
  .modal-box .mh{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--border)}
  .modal-box .mh h3{margin:0;font-size:16px;font-weight:800;color:var(--dark)}
  .modal-box .mh .x{border:0;background:transparent;cursor:pointer;color:var(--muted);width:32px;height:32px;border-radius:8px}
  .modal-box .mh .x:hover{background:var(--surface-2);color:var(--dark)}
  .modal-body{padding:18px;display:flex;flex-direction:column;gap:12px}
  .modal-foot{padding:13px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px} .frow.three{grid-template-columns:1fr 1fr 1fr}
  .fld{display:flex;flex-direction:column;gap:5px} .fld.full{grid-column:1/-1}
  .fld label{font-size:11.5px;font-weight:600;color:var(--muted)}
  .fld input,.fld select,.fld textarea{height:38px;border:1px solid var(--border);border-radius:8px;padding:0 11px;font-size:13.5px;background:var(--surface-2);outline:none;font-family:inherit;color:var(--ink)}
  .fld textarea{height:auto;padding:9px 11px;resize:vertical}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--red)}
  .modal-sec{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 -2px}
  .finblock{border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden}
  .finblock .fbh{background:var(--surface-2);padding:9px 13px;font-size:12.5px;font-weight:700;color:var(--dark);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
  .finblock .fbb{padding:11px 13px}

  .toast-wrap{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:100}
  .toast{background:var(--dark);color:#fff;padding:11px 15px;border-radius:9px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;animation:sl .2s ease}
  .toast svg{width:17px;height:17px;color:#4ade80}
  @keyframes sl{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  .notice{background:var(--low-bg);color:var(--low-fg);border:1px solid #f5e08a;border-radius:9px;padding:9px 13px;font-size:12.5px;margin-bottom:14px;display:flex;gap:8px;align-items:center}
  .notice svg{width:16px;height:16px;flex:none}

  @media(max-width:1080px){ .kpis{grid-template-columns:repeat(3,1fr)} .grid2{grid-template-columns:1fr} }
  @media(max-width:860px){
    .layout{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;bottom:0;width:240px;z-index:70;transform:translateX(-105%);transition:transform .2s} .side.open{transform:none}
    .side-toggle{display:inline-grid!important}
    .kpis{grid-template-columns:repeat(2,1fr)} .frow,.frow.three{grid-template-columns:1fr}
  }
  .side-toggle{display:none;width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;place-items:center;color:var(--dark)}
  .side-toggle svg{width:20px;height:20px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:65;display:none} .scrim.show{display:block}
  /* Chatter (timeline lateral estilo Odoo) + stepper + adjuntos + programar */
  .modal-box.xwide{max-width:1060px}
  .qlayout{display:grid;grid-template-columns:1fr 312px;gap:0}
  .qmain{padding-right:16px}
  .chatter{border-left:1px solid var(--border);padding-left:16px;display:flex;flex-direction:column;gap:12px}
  .chatter .cbar{display:flex;gap:6px;flex-wrap:wrap}
  .chatter .composer{border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .chatter .composer textarea{width:100%;border:0;padding:9px;font-family:inherit;font-size:12.5px;resize:vertical;min-height:50px;outline:none;color:var(--ink)}
  .chatter .composer .ctools{display:flex;align-items:center;gap:3px;padding:5px 7px;border-top:1px solid var(--border);background:var(--surface-2)}
  .chatter .composer .ctools .spacer{flex:1}
  .attach-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:11.5px;color:var(--mid)}
  .attach-chip svg{width:13px;height:13px;color:var(--red)} .attach-chip .rm{cursor:pointer;color:var(--faint)}
  .daysep{text-align:center;font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;border-top:1px solid var(--border);padding-top:8px}
  .tl{display:flex;flex-direction:column;gap:13px}
  .tl .ev{display:flex;gap:9px}
  .tl .av{width:28px;height:28px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
  .tl .av.sys{background:var(--surface-3);color:var(--muted)}
  .tl .evb{flex:1;min-width:0}
  .tl .evh{font-size:11px;color:var(--muted)} .tl .evh b{color:var(--dark)}
  .tl .chg{font-size:12px;margin-top:1px}
  .tl .chg .k{color:var(--muted)} .tl .chg .from{color:var(--faint)} .tl .chg .to{color:var(--red-600);font-weight:600}
  .tl .msg{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:3px;color:var(--mid)}
  .tl .evc{font-size:12px;color:var(--mid);margin-top:1px}
  .stepper{display:inline-flex;align-items:center}
  .stepper .st{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-right:0;padding:4px 13px;white-space:nowrap}
  .stepper .st:first-child{border-radius:6px 0 0 6px} .stepper .st:last-child{border-radius:0 6px 6px 0;border-right:1px solid var(--border)}
  .stepper .st.done{background:var(--dark);color:#fff;border-color:var(--dark)}
  .stepper .st.cur{background:var(--red);color:#fff;border-color:var(--red)}
  .sched{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:12.5px;color:var(--mid)}
  .sched input[type=datetime-local]{height:34px;border:1px solid var(--border);border-radius:7px;padding:0 8px;font-size:12.5px;background:var(--surface-2);color:var(--ink)}
  .chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
  .chk input{width:16px;height:16px;accent-color:var(--red)}
  .chipbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:var(--surface-2)}
  .chipbox .chipin{border:0;background:transparent;outline:none;font-size:13px;min-width:150px;flex:1;height:26px;color:var(--ink)}
  #emTo,#emCc{display:contents}
  @media(max-width:820px){ .qlayout{grid-template-columns:1fr} .qmain{padding-right:0} .chatter{border-left:0;border-top:1px solid var(--border);padding-left:0;padding-top:14px;margin-top:6px} }
</style>
</head>
<body>
<div class="mockflag">MAQUETA — Panel interno de <b>Autodiagnóstico</b> · paleta clara · datos ficticios (catálogo real) · usá el selector "Ver como rol" abajo a la izquierda</div>

<div class="layout">
  <aside class="side" id="side">
    <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l2-6 4 14 2-6h6"/></svg></span><span class="word">Auto<span>diag</span></span></div>
    <nav id="adminNav"></nav>
    <div class="foot">
      <div class="u"><span class="ua" id="uAvatar">FA</span><div><div class="un">Franco Andrino</div><div class="ue" id="uRole">Superadmin</div></div></div>
      <label>Ver como rol (demo)</label>
      <select id="roleSel" onchange="setRole(this.value)">
        <option value="superadmin">Superadmin (ve todo)</option>
        <option value="sales_billing">Ventas / Facturación</option>
        <option value="administration">Administración (solo Facturación)</option>
        <option value="logistics">Logística (solo Depósito)</option>
      </select>
      <div class="hint">El backend gatea por capability; cambiar roles es solo superadmin.</div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="side-toggle" onclick="document.getElementById('side').classList.toggle('open');document.getElementById('scrim').classList.toggle('show')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="secTitle">Dashboard</h1>
      <span class="rolechip" id="roleChip">Superadmin</span>
      <div class="spacer"></div>
      <div id="topActions"></div>
    </div>
    <div class="content">
      <section class="section active" id="sec-dashboard"></section>
      <section class="section" id="sec-catalog"></section>
      <section class="section" id="sec-products"></section>
      <section class="section" id="sec-clients"></section>
      <section class="section" id="sec-quotes"></section>
      <section class="section" id="sec-billing"></section>
      <section class="section" id="sec-logistics"></section>
      <section class="section" id="sec-settings"></section>
    </div>
  </div>
</div>

<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="scrim" id="scrim" onclick="document.getElementById('side').classList.remove('open');this.classList.remove('show')"></div>

function renderNav(){
  document.getElementById("adminNav").innerHTML=SECTIONS.map(s=>{
    const badge=s.id==="clients"?PENDING.length:(s.id==="quotes"?QUOTES.filter(q=>q.estado==="cotizacion").length:0);
    return `<button class="navitem" data-sec="${s.id}" onclick="goSec('${s.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${s.icon}</svg>${s.label}${badge?`<span class="nb">${badge}</span>`:""}</button>`;
  }).join("");
  applyRoleNav();
}
function applyRoleNav(){
  const allowed=SECTIONS_BY_ROLE[ROLE];
  document.querySelectorAll(".navitem").forEach(n=>n.classList.toggle("hidden",!allowed.includes(n.dataset.sec)));
  if(!allowed.includes(CUR)) goSec(allowed[0]);
  else goSec(CUR);
}
function setRole(r){
  ROLE=r;
  document.getElementById("roleChip").textContent=ROLE_LABEL[r];
  document.getElementById("uRole").textContent=ROLE_LABEL[r];
  applyRoleNav();
}
function goSec(id){
  CUR=id;
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById("sec-"+id).classList.add("active");
  document.querySelectorAll(".navitem").forEach(n=>n.classList.toggle("active",n.dataset.sec===id));
  document.getElementById("secTitle").textContent=SECTIONS.find(s=>s.id===id).label;
  document.getElementById("side").classList.remove("open"); document.getElementById("scrim").classList.remove("show");
  renderSection(id);
}

function quoteStepper(estado){
  if(estado==="cancelado") return '<div class="stepper"><span class="st done">Cotización</span><span class="st done">Cotización enviada</span><span class="st" style="background:var(--red);color:#fff;border-color:var(--red)">Cancelado</span></div>';
  const steps=["Cotización","Cotización enviada","Orden de venta","Despachado"];
  const idx = {cotizacion:0,enviada:1,orden:2,despachado:3}[estado] ?? 0;
  return '<div class="stepper">'+steps.map((s,i)=>`<span class="st ${i<idx?'done':''} ${i===idx?'cur':''}">${s}</span>`).join("")+'</div>';
}

function chatterHTML(entries){
